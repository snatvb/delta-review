[package]
name = "delta"
version = "0.1.0"
description = "A local-first desktop app for reviewing code diffs and leaving structured comments for Claude Code"
authors = ["Dario Ielardi"]
license = "MIT"
repository = "https://github.com/snatvb/delta-review"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "delta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.19"
sha2 = "0.10"
similar = "2"
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
notify = "6"
ignore = "0.4"
# SLEEPING TELEMETRY (dormant): analytics are disabled in this fork — the
# plugin registers only with a fork-owned DELTA_REVIEW_TELEMETRY_KEY baked in
# at build time, and the frontend gate (TELEMETRY_DORMANT in src/analytics.ts)
# keeps every event off. Kept in the tree so it can be revived later against
# an endpoint we own. Same for the tokio runtime below (only the plugin needs it).
tauri-plugin-aptabase = "1.0.0"
# Resolves the platform app-data base dir for the one-shot legacy-data
# migration in `migrate` (runs before the Tauri builder in lib.rs::run()).
dirs = "6"
dunce = "1"
# tauri-plugin-aptabase 1.0.0 starts its flush loop with `tokio::spawn` in its
# Tauri setup hook, which needs an ambient Tokio runtime that lib.rs::run() enters
# (release builds only, matching the plugin's own gate).
tokio = { version = "1", features = ["rt-multi-thread"] }
quick-xml = "0.42.0"

# vendored-openssl: statically link OpenSSL so signed/notarized release builds don't
# depend on Homebrew's libssl (rejected by hardened-runtime library validation -> launch crash).
# macOS-only: on Windows libgit2 uses WinHTTP/SChannel and building OpenSSL needs Perl + NASM.
[target.'cfg(target_os = "macos")'.dependencies]
git2 = { version = "0.19", features = ["vendored-openssl"] }

[dev-dependencies]
tempfile = "3"

